[unix_http_server]
file=/tmp/taskmaster_socket

[supervisord]
logfile=/tmp/taskmaster.log
umask=022

[program:cat_service]
command=/bin/cat
numprocs=1
umask=022
directory=/tmp
autostart=true
autorestart=true
exitcodes=0,2
startretries=5
startsecs=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/tmp/cat_stdout.log
stderr_logfile=/tmp/cat_stderr.log
environment=STARTED_BY="taskmaster",ANSWER="42"